<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | NESTORA</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="container navbar">

            <a href="index.html" class="logo">
                NESTORA
            </a>


            <nav class="nav-menu">

                <a href="index.html">
                    Home
                </a>

                <a href="shop.html">
                    Shop
                </a>

                <a href="new-arrivals.html">
                    New Arrivals
                </a>

                <a href="about.html">
                    About Us
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </nav>


            <div class="nav-icons">

                <button
                    class="icon-btn"
                    aria-label="Search">

                    <i class="fa-solid fa-magnifying-glass"></i>

                </button>


                <a
                    href="login.html"
                    class="icon-btn"
                    aria-label="Account">

                    <i class="fa-regular fa-user"></i>

                </a>


                <a
                    href="cart.html"
                    class="icon-btn cart-btn"
                    aria-label="Shopping cart">

                    <i class="fa-solid fa-bag-shopping"></i>

                    <span class="cart-count">
                        0
                    </span>

                </a>


                <button
                    class="menu-btn"
                    aria-label="Open menu">

                    <i class="fa-solid fa-bars"></i>

                </button>

            </div>

        </div>

    </header>



    <!-- ================= REGISTER ================= -->

    <main>

        <section class="register-section">

            <div class="register-container">


                <div class="register-heading">

                    <p class="eyebrow">
                        JOIN NESTORA
                    </p>

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Create an account to make your
                        NESTORA experience even better.
                    </p>

                </div>


                <!-- REGISTER FORM -->

                <form
                    class="register-form"
                    id="registerForm">


                    <!-- NAME -->

                    <div class="form-row">

                        <div class="form-group">

                            <label for="registerFirstName">
                                First Name
                            </label>

                            <input
                                type="text"
                                id="registerFirstName"
                                name="firstName"
                                placeholder="Your first name"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="registerLastName">
                                Last Name
                            </label>

                            <input
                                type="text"
                                id="registerLastName"
                                name="lastName"
                                placeholder="Your last name"
                                required>

                        </div>

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="registerEmail">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="registerEmail"
                            name="email"
                            placeholder="you@example.com"
                            required>

                    </div>


                    <!-- PASSWORD -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="registerPassword"
                                name="password"
                                placeholder="Create a password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="registerPasswordToggle"
                                aria-label="Show password">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="confirmPassword"
                                name="confirmPassword"
                                placeholder="Confirm your password"
                                required>

                            <button
                                type="button"
                                class="password-toggle"
                                id="confirmPasswordToggle"
                                aria-label="Show password">

                                <i class="fa-regular fa-eye"></i>

                            </button>

                        </div>

                    </div>


                    <!-- TERMS -->

                    <label class="register-terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <span>
                            I agree to the
                            <a href="#">
                                Terms & Conditions
                            </a>
                        </span>

                    </label>


                    <!-- MESSAGE -->

                    <p
                        class="register-message"
                        id="registerMessage">
                    </p>


                    <!-- BUTTON -->

                    <button
                        type="submit"
                        class="btn btn-primary register-button">

                        Create Account

                        <i class="fa-solid fa-arrow-right"></i>

                    </button>

                </form>


                <!-- LOGIN -->

                <div class="register-login">

                    <p>
                        Already have an account?
                    </p>

                    <a href="login.html">
                        Sign In
                    </a>

                </div>


            </div>

        </section>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container footer-bottom">

            <p>
                © 2026 NESTORA. All rights reserved.
            </p>


            <div class="social-icons">

                <a href="#" aria-label="Instagram">
                    <i class="fa-brands fa-instagram"></i>
                </a>

                <a href="#" aria-label="Pinterest">
                    <i class="fa-brands fa-pinterest-p"></i>
                </a>

                <a href="#" aria-label="Facebook">
                    <i class="fa-brands fa-facebook-f"></i>
                </a>

            </div>

        </div>

    </footer>



    <!-- JavaScript -->

    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>

</body>

</html>
